<script>
    const countries = [
      { iso: 'TWN', name: 'Taiwan',      val: 69.08,  lat: 23.7,  lon: 121.0, pos: 'middle right' },
      { iso: 'KOR', name: 'South Korea', val: 62.48,  lat: 36.5,  lon: 127.8, pos: 'top center' },
      { iso: 'MNG', name: 'Mongolia',    val: 36.14,  lat: 46.8,  lon: 103.8, pos: 'middle center' },
      { iso: 'THA', name: 'Thailand',    val: 25.59,  lat: 15.2,  lon: 100.5, pos: 'middle left' },
      { iso: 'SGP', name: 'Singapore',   val: 23.77,  lat: 1.35,  lon: 103.8, pos: 'bottom right' },
      { iso: 'JPN', name: 'Japan',       val: 21.13,  lat: 36.2,  lon: 138.2, pos: 'middle right' },
      { iso: 'LKA', name: 'Sri Lanka',   val: 11.13,  lat: 7.9,   lon: 80.8,  pos: 'bottom center' },
      { iso: 'BGD', name: 'Bangladesh',  val: 7.50,   lat: 23.8,  lon: 90.4,  pos: 'top right' },
      { iso: 'LAO', name: 'Laos',        val: 3.19,   lat: 19.8,  lon: 102.5, pos: 'top right' },
      { iso: 'CHN', name: 'China',       val: 2.70,   lat: 35.8,  lon: 103.0, pos: 'middle center' },
      { iso: 'PAK', name: 'Pakistan',    val: 2.18,   lat: 30.4,  lon: 69.3,  pos: 'middle center' },
      { iso: 'AUS', name: 'Australia',   val: 0.92,   lat: -25.3, lon: 133.8, pos: 'middle center' },
      { iso: 'MYS', name: 'Malaysia',    val: 0.09,   lat: 4.5,   lon: 101.5, pos: 'top left' },
      { iso: 'NZL', name: 'New Zealand', val: -0.62,  lat: -41.5, lon: 172.5, pos: 'middle right' },
      { iso: 'HKG', name: 'Hong Kong',   val: -3.59,  lat: 22.3,  lon: 114.2, pos: 'bottom left' },
      { iso: 'VNM', name: 'Vietnam',     val: -4.22,  lat: 14.5,  lon: 108.5, pos: 'middle right' },
      { iso: 'PHL', name: 'Philippines', val: -4.55,  lat: 12.9,  lon: 122.0, pos: 'middle right' },
      { iso: 'IND', name: 'India',       val: -8.90,  lat: 21.0,  lon: 78.9,  pos: 'middle center' },
      { iso: 'IDN', name: 'Indonesia',   val: -37.83, lat: -2.5,  lon: 118.0, pos: 'middle center' }
    ];

    const formatVal = (v) => (v > 0 ? `+${v.toFixed(2)}%` : `${v.toFixed(2)}%`);

    let currentCenter = { lat: 15, lon: 115 };
    let currentZoom = 1.6;

    function drawMap() {
      const isPortrait = window.innerHeight > window.innerWidth;

      const choroplethTrace = {
        type: 'choropleth',
        locationmode: 'ISO-3',
        locations: countries.map(c => c.iso),
        z: countries.map(c => c.val),
        text: countries.map(c => `${c.name}: ${formatVal(c.val)}`),
        hoverinfo: 'text',
        colorscale: [
          [0.0, '#b71c1c'],
          [0.35, '#ffffff'],
          [0.55, '#66bb6a'],
          [1.0, '#004d40']
        ],
        zmin: -40,
        zmax: 70,
        colorbar: {
          title: { text: '1-Year Avg', font: { size: 10 } },
          ticksuffix: '%',
          len: isPortrait ? 0.35 : 0.6,
          thickness: 10,
          y: isPortrait ? 0.35 : 0.5,
          x: isPortrait ? 0.88 : 0.92,
          font: { size: 9 }
        }
      };

      const labelTrace = {
        type: 'scattergeo',
        mode: 'markers+text',
        lat: countries.map(c => c.lat),
        lon: countries.map(c => c.lon),
        text: countries.map(c => `<b>${c.name}</b><br>${formatVal(c.val)}`),
        textposition: countries.map(c => c.pos),
        hoverinfo: 'skip',
        marker: { size: 3, color: '#111111' },
        textfont: {
          family: 'Segoe UI, Arial, sans-serif',
          size: isPortrait ? 8.5 : 10,
          color: '#111111'
        }
      };

      const layout = {
        title: {
          text: '<b>Asia-Pacific 1-Year Stock Index Trend Map By Hijrahgeograph</b><br><span style="font-size:12px;color:#555;">as of 19 October 2026 | Source: Bloomberg 2026</span>',
          font: { size: isPortrait ? 11 : 14 },
          y: 0.96
        },
        margin: { t: 75, b: 0, l: 0, r: 0 },
        geo: {
          scope: 'asia',
          projection: { type: 'mercator' },
          center: currentCenter,
          zoom: currentZoom,
          showland: true,
          landcolor: '#f0f0f0',
          showocean: true,
          oceancolor: '#e3f2fd',
          showcountries: true,
          countrycolor: '#bdbdbd',
          countrywidth: 0.6
        }
      };

      Plotly.newPlot('map', [choroplethTrace, labelTrace], layout, { responsive: true, displayModeBar: false });
    }

    function zoomMap(factor) {
      currentZoom *= factor;
      Plotly.relayout('map', { 'geo.zoom': currentZoom });
    }

    function panMap(direction) {
      const step = 5 / currentZoom;
      if (direction === 'up') currentCenter.lat += step;
      if (direction === 'down') currentCenter.lat -= step;
      if (direction === 'left') currentCenter.lon -= step;
      if (direction === 'right') currentCenter.lon += step;
      Plotly.relayout('map', { 'geo.center': currentCenter });
    }

    function resetMap() {
      const isPortrait = window.innerHeight > window.innerWidth;
      currentCenter = { lat: 15, lon: 115 };
      currentZoom = isPortrait ? 1.5 : 1.6;
      drawMap();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Direct event listener binding
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btn-overview').onclick = resetMap;
      document.getElementById('btn-summary').onclick = () => document.getElementById('summary-table').scrollIntoView({ behavior: 'smooth' });
      document.getElementById('btn-up').onclick = () => panMap('up');
      document.getElementById('btn-down').onclick = () => panMap('down');
      document.getElementById('btn-left').onclick = () => panMap('left');
      document.getElementById('btn-right').onclick = () => panMap('right');
      document.getElementById('btn-zoomin').onclick = () => zoomMap(1.3);
      document.getElementById('btn-zoomout').onclick = () => zoomMap(0.7);
      document.getElementById('btn-reset').onclick = resetMap;
    });

    // Initial render
    drawMap();
    window.addEventListener('resize', drawMap);
  </script>
